<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank you</title>
    <style>
        .box{
            box-shadow: 0 0 10px;
            width: 500px;
            height: 500px;
            align-content: center;
            font-size: 30px;
            text-align: center;
            position: absolute;
            left: 650px;
            top: 100px;
            border: 5px solid black;
            background-color: rgb(229, 203, 183);
        }
        .box h3{
            text-shadow: 0 0 10px rgb(214, 181, 181);
        }
        .box p{
            font-size: 50px;
        }
        body{
            background-color: rgb(124, 96, 76);
        }
        @media screen and (max-width: 600px) {

    body {
        margin: 0;
        padding: 10px;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        box-sizing: border-box;
    }

    .box {
        position: relative;
        left: auto;
        top: auto;

        width: 90%;
        max-width: 500px;
        height: auto;
        min-height: 350px;

        box-sizing: border-box;
        padding: 20px;

        font-size: 24px;
    }

    .box h3 {
        font-size: 26px;
    }

    .box p {
        font-size: 22px;
    }
}
    </style>
</head>
<body>
    <div class="box">
      <b><h3>THANK YOU TO ORDER</h3></b> 
              <p>🎂🎉🎊🎂</p>
    </div>
    
</body>
</html>
